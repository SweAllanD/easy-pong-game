<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Easy Pong</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --paddle: #f3f6ff;
      --ball: #ffd166;
      --line: rgba(255,255,255,0.14);
      --text: #e8eefb;
      --green: #62dca4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-wrap {
      position: relative;
      width: min(100vw - 12px, 980px);
      height: min(78vh, 560px);
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #101a2d, #0d1528);
      border: 2px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,0.38);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: rgba(8, 13, 23, 0.94);
      touch-action: none;
    }

    .hud {
      position: absolute;
      inset: 12px 0 auto 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    .score {
      font-size: clamp(18px, 2.8vw, 34px);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      color: var(--text);
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 12px;
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
      z-index: 2;
    }

    .btn {
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      min-width: 120px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn.primary {
      background: rgba(98, 220, 164, 0.18);
      border-color: rgba(98, 220, 164, 0.5);
      color: #dfffee;
    }

    @media (max-width: 480px) {
      .game-wrap {
        width: 98vw;
        height: 74vh;
        border-radius: 16px;
      }

      .controls {
        bottom: calc(10px + env(safe-area-inset-bottom));
      }

      .btn {
        min-width: 90px;
        padding: 9px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="score" id="score">0 : 0</div>
    </div>

    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <div class="controls">
      <button class="btn primary" id="restartBtn">Restart</button>
      <button class="btn" id="pauseBtn">Pause</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const state = {
      running: true,
      paused: false,
      lastTime: 0,
      scoreLeft: 0,
      scoreRight: 0
    };

    const paddleHeight = 120;
    const paddleWidth = 16;
    const paddleSpeed = 620;

    const leftPaddle = {
      x: 28,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      targetY: canvas.height / 2 - paddleHeight / 2,
      speed: paddleSpeed
    };

    const rightPaddle = {
      x: canvas.width - 28 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      targetY: canvas.height / 2 - paddleHeight / 2,
      speed: 520
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 10,
      speed: 420,
      vx: 420,
      vy: 180
    };

    const input = {
      leftTargetY: canvas.height / 2 - paddleHeight / 2,
      pointerActive: false,
      keyboardUp: false,
      keyboardDown: false
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function setLeftTargetFromPointer(y) {
      input.leftTargetY = clamp(y - leftPaddle.height / 2, 0, canvas.height - leftPaddle.height);
    }

    function updateScore() {
      scoreEl.textContent = `${state.scoreLeft} : ${state.scoreRight}`;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      const angle = (Math.random() * 0.9) - 0.45;
      const baseSpeed = ball.speed;
      ball.vx = direction * baseSpeed * Math.cos(angle + Math.PI / 4);
      ball.vy = baseSpeed * Math.sin(angle + Math.PI / 4);
    }

    function updateLeftPaddle(dt) {
      const keyboardDir = (input.keyboardDown ? 1 : 0) - (input.keyboardUp ? 1 : 0);
      if (keyboardDir !== 0) {
        input.leftTargetY = clamp(leftPaddle.y + keyboardDir * 30, 0, canvas.height - leftPaddle.height);
      }

      leftPaddle.y += (input.leftTargetY - leftPaddle.y) * Math.min(1, 12 * dt);
      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
    }

    function updateRightPaddle(dt) {
      const targetCenter = ball.y;
      const targetY = targetCenter - rightPaddle.height / 2;
      rightPaddle.y += (targetY - rightPaddle.y) * Math.min(1, 5.8 * dt);
      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function updateBall(dt) {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.vy *= -1;
        ball.y = clamp(ball.y, ball.radius, canvas.height - ball.radius);
      }

      const leftRect = {
        left: leftPaddle.x,
        right: leftPaddle.x + leftPaddle.width,
        top: leftPaddle.y,
        bottom: leftPaddle.y + leftPaddle.height
      };

      const rightRect = {
        left: rightPaddle.x,
        right: rightPaddle.x + rightPaddle.width,
        top: rightPaddle.y,
        bottom: rightPaddle.y + rightPaddle.height
      };

      if (
        ball.x - ball.radius <= leftRect.right &&
        ball.x + ball.radius >= leftRect.left &&
        ball.y >= leftRect.top &&
        ball.y <= leftRect.bottom &&
        ball.vx < 0
      ) {
        const hitPos = (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
        const bounceAngle = hitPos * 1.1;
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 18, 720);
        ball.vx = speed * Math.cos(bounceAngle);
        ball.vy = speed * Math.sin(bounceAngle);
        ball.x = leftRect.right + ball.radius;
      }

      if (
        ball.x + ball.radius >= rightRect.left &&
        ball.x - ball.radius <= rightRect.right &&
        ball.y >= rightRect.top &&
        ball.y <= rightRect.bottom &&
        ball.vx > 0
      ) {
        const hitPos = (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
        const bounceAngle = hitPos * 1.1;
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 18, 720);
        ball.vx = -speed * Math.cos(bounceAngle);
        ball.vy = speed * Math.sin(bounceAngle);
        ball.x = rightRect.left - ball.radius;
      }

      if (ball.x < -22) {
        state.scoreRight += 1;
        updateScore();
        resetBall(1);
      }

      if (ball.x > canvas.width + 22) {
        state.scoreLeft += 1;
        updateScore();
        resetBall(-1);
      }
    }

    function drawCenterLine() {
      ctx.strokeStyle = "rgba(255,255,255,0.14)";
      ctx.lineWidth = 4;
      ctx.setLineDash([16, 14]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(paddle, color) {
      ctx.fillStyle = color;
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCenterLine();
      drawPaddle(leftPaddle, "#f3f6ff");
      drawPaddle(rightPaddle, "#f3f6ff");
      drawBall();

      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.fillRect(0, 0, canvas.width, 2);
      ctx.fillRect(0, canvas.height - 2, canvas.width, 2);
    }

    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - state.lastTime) / 1000 || 0.016, 0.025);
      state.lastTime = timestamp;

      if (!state.paused) {
        updateLeftPaddle(dt);
        updateRightPaddle(dt);
        updateBall(dt);
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function onPointerMoveClientY(clientY) {
      const rect = canvas.getBoundingClientRect();
      const y = (clientY - rect.top) * (canvas.height / rect.height);
      setLeftTargetFromPointer(y);
    }

    canvas.addEventListener("pointerdown", (event) => {
      input.pointerActive = true;
      onPointerMoveClientY(event.clientY);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (input.pointerActive) {
        onPointerMoveClientY(event.clientY);
      }
    });

    canvas.addEventListener("pointerup", () => {
      input.pointerActive = false;
    });

    canvas.addEventListener("pointerleave", () => {
      input.pointerActive = false;
    });

    window.addEventListener("keydown", (event) => {
      if (event.code === "KeyW" || event.code === "ArrowUp") input.keyboardUp = true;
      if (event.code === "KeyS" || event.code === "ArrowDown") input.keyboardDown = true;
    });

    window.addEventListener("keyup", (event) => {
      if (event.code === "KeyW" || event.code === "ArrowUp") input.keyboardUp = false;
      if (event.code === "KeyS" || event.code === "ArrowDown") input.keyboardDown = false;
    });

    restartBtn.addEventListener("click", () => {
      state.scoreLeft = 0;
      state.scoreRight = 0;
      updateScore();
      resetBall(Math.random() > 0.5 ? 1 : -1);
      state.paused = false;
      pauseBtn.textContent = "Pause";
    });

    pauseBtn.addEventListener("click", () => {
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? "Resume" : "Pause";
    });

    updateScore();
    resetBall(Math.random() > 0.5 ? 1 : -1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
